<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Radio Player</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #e0e0e0;
        }
        .player-container {
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        audio {
            width: 100%;
            height: 36px;
            border-radius: 6px;
            outline: none;
        }
        .now-playing {
            font-size: 13px;
            color: #0088ff;
            font-weight: 500;
            min-height: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Компактная сетка для кнопок */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 колонки аккуратных небольших кнопок */
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            padding: 8px 10px; /* Компактный размер */
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #3a3a3a;
            border-color: #555;
        }
        button.active {
            background: #0066cc;
            color: #ffffff;
            border-color: #0088ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🚗 Авто Радио Плеер</h1>

    <div class="player-container">
        <div class="now-playing" id="nowPlaying">Выберите станцию</div>
        <audio id="audioPlayer" controls autoplay></audio>
        
        <div class="station-grid" id="stationList">
            <!-- Компактные кнопки будут добавлены автоматически -->
        </div>
    </div>

    <script>
        const stations = [
            { name: "Українське Радіо", url: "https://stream.ukr.radio:8443/ur1-mp3" },
            { name: "Кекс FM (90-2000)", url: "https://dorognoe.hostingradio.ru/keksfm64.aac" },
            { name: "Дорожное радио", url: "https://online2.gkvr.ru:8001/doroznoe_kem_64.aac" },
            // Сюда подставь свои 7 проверенных ссылок:
            { name: "Маятник Фуко", url: "ТВОЯ_ССЫЛКА_7" },
            { name: "Станция 2", url: "ТВОЯ_ССЫЛКА_2" },
            { name: "Станция 3", url: "ТВОЯ_ССЫЛКА_3" },
            { name: "Станция 4", url: "ТВОЯ_ССЫЛКА_4" },
            { name: "Станция 5", url: "ТВОЯ_ССЫЛКА_5" },
            { name: "Станция 6", url: "ТВОЯ_ССЫЛКА_6" },
            { name: "Станция 7", url: "ТВОЯ_ССЫЛКА_7_ОБЩАЯ" }
        ];

        const audioPlayer = document.getElementById('audioPlayer');
        const nowPlaying = document.getElementById('nowPlaying');
        const stationList = document.getElementById('stationList');

        function playStation(url, name, btnElement) {
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.log("Автоплей заблокирован браузером:", e));
            nowPlaying.textContent = "Играет: " + name;

            document.querySelectorAll('.station-grid button').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
        }

        stations.forEach((station) => {
            const btn = document.createElement('button');
            btn.textContent = station.name;
            btn.title = station.name;
            btn.onclick = () => playStation(station.url, station.name, btn);
            stationList.appendChild(btn);
        });
    </script>

</body>
</html>
