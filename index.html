<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tesla Radio</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #e5e5e5; }
        .player-box {
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            text-align: center;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        audio { width: 100%; margin-top: 10px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }
        button {
            background-color: #2a2a2a;
            color: #fff;
            border: 2px solid #3d3d3d;
            padding: 18px 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:active, button.active {
            background-color: #3b82f6;
            border-color: #60a5fa;
            transform: scale(0.98);
        }
        .status { margin-top: 8px; font-size: 14px; color: #3b82f6; }
    </style>
</head>
<body>

    <h1>Tesla Web Radio</h1>

    <div class="player-box">
        <div id="now-playing" class="status">Выберите станцию</div>
        <audio id="audio" controls preload="none"></audio>
    </div>

    <div class="grid">
        <button onclick="playStream('https://record-radio.ru/radio/megamix/stream.mp3', 'Record Megamix')">Record Megamix</button>
        <button onclick="playStream('https://icecast.russkoeradio.cdnvideo.ru/rr_h.mp3', 'Русское Радио')">Русское Радио</button>
        <button onclick="playStream('https://icecast-radiovanya.cdnvideo.ru/rv_90', 'Радио Ваня 90')">Радио Ваня 90</button>
        <button onclick="playStream('https://myradio24.com/90s', 'PCRadio 90s')">PCRadio 90s</button>
        <button onclick="playStream('https://nashe1.hostingradio.ru/solfm90.mp3', 'Sol FM 90')">Sol FM 90</button>
        <button onclick="playStream('https://record-radio.ru/radio/techno/stream.mp3', 'Record Techno')">Record Techno</button>
        <button onclick="playStream('https://record-radio.ru/radio/edm/stream.mp3', 'Record EDM')">Record EDM</button>
        <button onclick="playStream('https://record-radio.ru/radio/minimal/stream.mp3', 'Record Minimal')">Record Minimal</button>
        <button onclick="playStream('https://online.kissfm.ua/KissFM_Ukr_Live', 'Kiss FM Ukraine')">Kiss FM</button>
        <button onclick="playStream('https://radio.nrcu.gov.ua/ur1-mp3', 'Українське Радіо')">УР-1</button>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const status = document.getElementById('now-playing');

        function playStream(url, name) {
            audio.src = url;
            audio.play().catch(e => console.log('Ошибка воспроизведения:', e));
            status.textContent = 'Играет: ' + name;
            
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }
    </script>
</body>
</html>
